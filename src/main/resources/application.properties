spring.application.name=HomeServices

server.port=8080

# MariaDB database configuration
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/homeservices}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
# Admin bootstrap configuration
app.bootstrap.admin-email=${ADMIN_EMAIL:admin@homeservices.local}
app.bootstrap.admin-password=${ADMIN_PASSWORD}
