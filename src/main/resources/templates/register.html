<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | HomeServices</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css(v=5)}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main class="register-shell container"><div class="page-heading"><span class="eyebrow" th:text="${role == 'PROVIDER' ? 'GROW YOUR LOCAL BUSINESS' : 'GET STARTED'}">GET STARTED</span><h1 th:text="${role == 'PROVIDER' ? 'Join as a provider.' : 'Create your account.'}">Create your account.</h1><p th:text="${role == 'PROVIDER' ? 'Tell us about your business. An administrator will review your details before your services become visible.' : 'Create an account to discover services and book trusted local professionals.'}">Create an account.</p></div><div class="form-card"><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form th:action="@{/register}" th:object="${form}" method="post" class="form-stack two-column"><input type="hidden" name="role" th:value="${role}"><label>Full name<input th:field="*{fullName}" required maxlength="100" placeholder="Your full name"></label><label>Email address<input type="email" th:field="*{email}" required maxlength="150" placeholder="you@example.com"></label><label>Phone number<input type="tel" th:field="*{phone}" maxlength="20" placeholder="Mobile number"></label><label>Password<input type="password" th:field="*{password}" required minlength="8" placeholder="At least 8 characters"></label><div class="form-divider" th:if="${role == 'PROVIDER'}"><span>BUSINESS DETAILS</span></div><th:block th:if="${role == 'PROVIDER'}"><label>Business / professional name<input th:field="*{businessName}" required maxlength="120" placeholder="e.g. Raju Electrical Works"></label><label>Years of experience<input type="number" th:field="*{experienceYears}" min="0" max="60" value="0"></label><label>City<input th:field="*{city}" required maxlength="80" placeholder="e.g. Warangal"></label><label>Area / neighbourhood<input th:field="*{area}" maxlength="100" placeholder="e.g. Hanamkonda"></label><label class="full-span">Business address<input th:field="*{address}" maxlength="255" placeholder="Street and locality"></label><label class="full-span">About your work<textarea th:field="*{description}" rows="3" maxlength="1500" placeholder="Describe your experience and the work you provide"></textarea></label></th:block><button class="btn btn-gold full-span hs-magnetic" type="submit" data-cursor-label="JOIN" th:text="${role == 'PROVIDER' ? 'Submit provider application →' : 'Create account →'}">Create account</button></form><p class="auth-switch">Already registered? <a th:href="@{/login}">Sign in</a></p><p class="auth-switch" th:if="${role == 'CUSTOMER'}">Are you a service professional? <a th:href="@{/register/provider}">Register as a provider</a></p></div></main><div th:replace="~{fragments/layout :: footer}"></div></body></html>
