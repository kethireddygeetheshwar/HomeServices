<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Provider application | HomeServices</title><link rel="stylesheet" th:href="@{/css/style.css(v=5)}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main class="container pending-shell"><div class="pending-icon" th:text="${profile.status.name() == 'REJECTED' ? '!' : '◷'}">◷</div><span class="eyebrow">PROVIDER APPLICATION</span><h1 th:text="${profile.status.name() == 'REJECTED' ? 'Application not approved.' : 'Your application is under review.'}">Application under review</h1><p th:text="${profile.status.name() == 'REJECTED' ? 'Your provider profile was not approved. Please contact the platform administrator for further information.' : 'Thank you for joining HomeServices. Our administrator will review your provider details. You will be able to list services and publish availability once approved.'}">Application under review.</p><div class="pending-business"><strong th:text="${profile.businessName}">Business name</strong><small th:text="${profile.city + (profile.area != null ? ', ' + profile.area : '')}">Location</small><span class="status-pill" th:classappend="${#strings.toLowerCase(profile.status.name())}" th:text="${profile.status}">PENDING</span></div><a class="btn btn-outline-gold" th:href="@{/}">Back to home</a></main><div th:replace="~{fragments/layout :: footer}"></div></body></html>
